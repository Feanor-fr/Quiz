databaseChangeLog:
  - changeSet:
      id: 005-create-quizzes-table
      author: Feanor
      changes:
        - createTable:
            tableName: quizzes
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    nullable: false
              - column:
                  name: creator
                  type: varchar (100)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar (100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar (100)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: integer
                  constraints:
                    nullable: false