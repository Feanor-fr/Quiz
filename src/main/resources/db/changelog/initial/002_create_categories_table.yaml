databaseChangeLog:
  - changeSet:
      id: 002-create-categories-table
      author: Feanor
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false